name: jarvis

x-database-url: &database-url postgresql+asyncpg://${POSTGRES_USER:-jarvis}:${POSTGRES_PASSWORD:-jarvis}@postgres:5432/${POSTGRES_DB:-jarvis}

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: jarvis-app:local
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: *database-url
    # The caller account's Telethon session and api_hash are full access to that Telegram account: only the `caller`
    # service gets them (it overrides `environment`); everywhere else they are blanked.
    TELEGRAM_CALLER_SESSION: ""
    TELEGRAM_CALLER_API_HASH: ""
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis}
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: ["jarvis", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["jarvis", "api", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      # Default: loopback only. On the VPS set JARVIS_API_BIND to the Tailscale IP so the Dev Worker can reach it.
      - "${JARVIS_API_BIND:-127.0.0.1}:${JARVIS_API_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  health:
    <<: *app
    # Watch and scale data from the phone (Health Connect → Life Dashboard Companion). Only POST /webhooks/health
    # and GET /health are served here, HMAC-signed; the full API stays on loopback. Home network only.
    command: ["jarvis", "health-api", "--host", "0.0.0.0", "--port", "8091"]
    # The one service on the LAN gets no .env: only what the intake needs (an allowlist, so a secret added to .env
    # later never reaches it). It stores signed payloads and queues `health.ingest`; the worker does the rest.
    env_file: []
    environment:
      DATABASE_URL: *database-url
      HEALTH_WEBHOOK_SECRET: ${HEALTH_WEBHOOK_SECRET:-}
      JARVIS_ENV: ${JARVIS_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      DEFAULT_USER_TIMEZONE: ${DEFAULT_USER_TIMEZONE:-Asia/Tbilisi}
    ports:
      - "${HEALTH_BIND:-0.0.0.0}:${HEALTH_HOST_PORT:-8097}:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *app
    command: ["jarvis", "worker"]
    healthcheck:
      test: ["CMD", "jarvis", "heartbeat-check", "--role", "worker", "--max-age", "60"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *app
    command: ["jarvis", "scheduler"]
    healthcheck:
      test: ["CMD", "jarvis", "heartbeat-check", "--role", "scheduler", "--max-age", "120"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  bot:
    <<: *app
    command: ["jarvis", "bot"]
    healthcheck:
      test: ["CMD", "jarvis", "heartbeat-check", "--role", "bot", "--max-age", "180"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Telegram calls (pilot): a second Telegram account rings the user; idle until `jarvis caller-login`.
  caller:
    <<: *app
    command: ["jarvis", "caller"]
    environment:
      DATABASE_URL: *database-url  # and the caller secrets from .env, which the other services have blanked
    healthcheck:
      test: ["CMD", "jarvis", "heartbeat-check", "--role", "caller", "--max-age", "180"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    profiles: ["public"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      JARVIS_DOMAIN: ${JARVIS_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
