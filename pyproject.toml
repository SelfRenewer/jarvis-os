[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS — personal AI operating layer (Todoist, Google Calendar, Telegram, voice, ideas, dev jobs, shopping)"
readme = "README.md"
license = "MIT"
authors = [{ name = "SelfRenewer" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "anthropic>=1.0",
    "pgvector>=0.3",
    "cryptography>=43",
    "tzdata>=2024.1",
    "pyyaml>=6.0",
    "lameenc>=1.8",
    "icalendar==7.3.0",
    "recurring-ical-events==3.8.2",
    "telethon==1.45.0",
    "py-tgcalls==3.0.0",
    "ntgcalls==3.0.3",
]

[project.optional-dependencies]
devworker = ["claude-agent-sdk>=0.2"]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-dev-worker = "dev_worker.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis", "dev_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --strict-markers --ignore=tests/live"
markers = [
    "db: needs PostgreSQL (TEST_DATABASE_URL)",
    "live: opt-in tests against real external services (never run by default)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "DTZ", "RUF", "SIM", "PT"]
ignore = [
    "S101",   # asserts are fine in tests and for invariants
    "RUF001", "RUF002", "RUF003",  # Cyrillic text is intentional
    "S311",   # random is not used for security
    "B008",   # FastAPI Depends in defaults
    "ASYNC109",  # `timeout` params are protocol values (Telegram long polling), not asyncio timeouts
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108", "DTZ001", "S603", "S607", "PT018", "ASYNC109", "ASYNC240"]
"dev_worker/**" = ["S603", "S607"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
packages = ["jarvis", "dev_worker"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
plugins = ["pydantic.mypy"]
