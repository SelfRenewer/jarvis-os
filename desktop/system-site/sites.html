<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Сайты Jarvis OS: TLT, который Jarvis держит запущенным, и все сайты LocalSites — запуск, ссылка для дома, туннель.">
  <title>Сайты · Jarvis OS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%237fd8ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%237fd8ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-sites">
  <nav class="topbar" aria-label="Меню Jarvis OS">
    <a class="tb" href="/">Карта</a>
    <a class="tb" href="/sites" aria-current="page">Сайты</a>
    <a class="tb" href="/lab">Лаборатория</a>
    <a class="tb" href="/iphone">iPhone</a>
    <a class="tb" href="/devices">Телефон</a>
    <a class="tb" href="/tlt">TLT</a>
    <a class="tb" href="/crm">CRM</a>
  </nav>

  <main class="sites-main">
    <header class="sites-head">
      <h1>Сайты</h1>
      <p class="sites-sub" id="sites-sub">Загружаю…</p>
    </header>

    <section aria-labelledby="own-title">
      <h2 id="own-title">Jarvis OS держит запущенным</h2>
      <div id="services" class="site-grid"></div>
    </section>

    <section aria-labelledby="ls-title">
      <div class="section-row">
        <h2 id="ls-title">Сайты LocalSites</h2>
        <label class="filter">
          <span class="visually-hidden">Найти сайт</span>
          <input id="filter" type="search" placeholder="Найти сайт" autocomplete="off" spellcheck="false">
        </label>
      </div>
      <div id="banner" class="banner" hidden></div>
      <div id="groups"></div>
    </section>
  </main>
  <p class="visually-hidden" id="status" role="status" aria-live="polite"></p>

  <noscript><p class="noscript">Странице нужен JavaScript.</p></noscript>
  <script src="sites.js"></script>
</body>
</html>
