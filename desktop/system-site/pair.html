<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Привязать телефон · Jarvis OS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%237fd8ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%237fd8ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body class="gate">
  <main class="gate-box pair-box">
    <h1>Jarvis OS</h1>
    <p id="pair-text">Привязать этот телефон? Дальше он будет заходить сам.</p>
    <form id="pair-form">
      <label class="pair-label">Как назвать устройство
        <input id="pair-name" type="text" maxlength="40" autocomplete="off" spellcheck="false">
      </label>
      <button id="pair-go" type="submit" class="btn primary">Привязать</button>
    </form>
    <p id="pair-error" class="pair-error" role="alert" hidden></p>
  </main>
  <script type="module" src="pair.js"></script>
</body>
</html>
